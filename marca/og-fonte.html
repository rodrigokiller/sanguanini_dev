<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>og:image - fonte</title>
<style>
  /* Fonte da imagem OG (1200x630). Para regenerar:
     chrome --headless=new --window-size=1200,630 --screenshot=img/og.png marca/og-fonte.html */
  @font-face {
    font-family: 'Inter';
    font-weight: 100 900;
    src: url('../fonts/inter-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 100 800;
    src: url('../fonts/jetbrains-mono-latin.woff2') format('woff2');
  }
  * { margin: 0; box-sizing: border-box; border-radius: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b0e10;
    color: #d6e2dc;
    font-family: 'JetBrains Mono', monospace;
    position: relative;
    display: flex; flex-direction: column;
  }
  /* brilho de fósforo no canto, como no hero do site */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(720px 420px at 88% -12%, rgba(52, 226, 160, 0.16), transparent 70%);
  }
  /* scanlines + vinheta */
  .crt {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 3px);
  }
  .vinheta {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.42));
  }

  .conteudo {
    position: relative; flex: 1;
    padding: 64px 80px 0;
    display: flex; flex-direction: column; justify-content: center; gap: 26px;
  }
  .prompt { font-size: 22px; color: #7f948c; }
  .prompt .user { color: #34e2a0; }
  .prompt .cmd { color: #eaf3ee; }
  .caret {
    display: inline-block; width: 13px; height: 26px;
    background: #34e2a0; vertical-align: -3px; margin-left: 2px;
  }

  .marca-linha { display: flex; align-items: center; gap: 28px; }
  h1 {
    font-size: 74px; font-weight: 700; letter-spacing: -0.025em;
    color: #eaf3ee; line-height: 1.05;
  }
  h1 .dev { color: #34e2a0; }

  .sub {
    font-family: 'Inter', sans-serif; font-size: 27px; color: #d6e2dc;
    max-width: 36em; line-height: 1.5;
  }
  .sub b { color: #eaf3ee; font-weight: 600; }

  /* barra de status inferior, como o rodapé do site */
  .status {
    position: relative;
    border-top: 1px solid #1c262c; background: #10151a;
    padding: 20px 80px;
    display: flex; align-items: center; gap: 40px;
    font-size: 19px; color: #7f948c;
  }
  .status .on::before { content: '● '; color: #34e2a0; }
  .produtos { display: flex; gap: 12px; margin-left: auto; align-items: center; }
  .produtos i { width: 18px; height: 18px; display: block; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="conteudo">
    <div class="prompt"><span class="user">rodrigo@sanguanini.dev</span>:~$ <span class="cmd">whoami</span><span class="caret"></span></div>
    <div class="marca-linha">
      <svg width="110" height="110" viewBox="0 0 32 32" aria-hidden="true">
        <polygon points="10,5 26,5 26,11 12,11 12,13 16,13 16,19 6,19 6,9" fill="#34e2a0"/>
        <polygon points="22,27 6,27 6,21 20,21 20,19 16,19 16,13 26,13 26,23" fill="#d6e2dc"/>
      </svg>
      <h1>sanguanini<span class="dev">.dev</span></h1>
    </div>
    <div class="sub">
      <b>Rodrigo Sanguanini</b>, desenvolvedor de software e consultor Senior ERP.
      Produtos web, integrações e ferramentas de romhacking.
    </div>
  </div>

  <div class="status">
    <span class="on">online</span>
    <span>SC · Brasil</span>
    <span class="produtos">
      <i style="background:#e08b3c"></i>
      <i style="background:#639ff7"></i>
      <i style="background:#34e2a0"></i>
      <i style="background:#2ec4a6"></i>
      <i style="background:#a78bfa"></i>
      <i style="background:#7dc4ff"></i>
    </span>
  </div>

  <div class="crt"></div>
  <div class="vinheta"></div>
</body>
</html>
